 if(active==='base64')return panel('🔐 '+title('base64'),toolDesc('base64'),`<textarea id="bt" class="text-area" placeholder="${t.paste}"></textarea><div class="controls"><button id="enc">Encode</button><button id="dec">Decode</button></div><div id="results" class="results"></div>`);

 if(active==='text-translate'||active==='text-summary')return panel('🌐 '+title(active==='text-translate'?'textTranslate':'textSummary'),toolDesc(active==='text-translate'?'textTranslate':'textSummary'),`<textarea id="tt" class="text-area" placeholder="${t.paste}"></textarea>${active==='text-translate'?`<div class="controls"><label class="field">${t.source}<select id="srcLang">${langOptions()}</select></label><label class="field">${t.target}<select id="tgtLang">${langOptions()}</select></label></div>`:''}<div class="status">${active==='text-translate'?t.translationNote:t.summaryNote}</div><div class="controls"><button id="run">${active==='text-translate'?t.translate:t.summarize}</button></div><div id="results" class="results"></div>`);
 if(active==='text-count')return panel('🔢 '+title('textCount'),toolDesc('textCount'),`<textarea id="tt" class="text-area" placeholder="${t.paste}"></textarea><div class="controls"><button id="run">${t.textCount}</button></div><div id="results" class="results"></div>`);
 if(active==='text-case')return panel('Aa '+title('textCase'),toolDesc('textCase'),`<textarea id="tt" class="text-area" placeholder="${t.paste}"></textarea><div class="controls"><select id="caseMode"><option value="upper">${t.upper}</option><option value="lower">${t.lower}</option><option value="title">${t.titleCase}</option></select><button id="run">${t.textCase}</button></div><div id="results" class="results"></div>`);
 if(active==='text-clean')return panel('🧹 '+title('textClean'),toolDesc('textClean'),`<textarea id="tt" class="text-area" placeholder="${t.paste}"></textarea><div class="controls"><button id="run">${t.clean}</button></div><div id="results" class="results"></div>`);
}
async function imageCanvas(f,opts={}){const img=await loadImage(f),rot=opts.rot||0,sw=img.naturalWidth,sh=img.naturalHeight;let w=opts.w||sw,h=opts.h||sh;if(opts.crop){w=Math.min(w,sw);h=Math.min(h,sh)}const swap=rot===90||rot===270,c=document.createElement('canvas');c.width=swap?h:w;c.height=swap?w:h;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.scale(opts.fh?-1:1,opts.fv?-1:1);x.drawImage(img,opts.crop?0:-w/2,opts.crop?0:-h/2,w,h);return c}
async function runImage(){if(!needFiles())return;const t=L(),f=currentFiles[0];try{if(active==='img-compress'){let out='';for(const file of currentFiles){const c=await imageCanvas(file),b=await blobCanvas(c,'image/jpeg',+$('q').value/100),u=URL.createObjectURL(b);out+=`<div class="item"><img class="thumb" src="${u}"><div class="info"><div class="name">${esc(file.name)}</div><div class="meta">${fmt(file.size)} → ${fmt(b.size)}</div></div><a class="download" download="compressed-${esc(file.name.replace(/\.[^.]+$/,''))}.jpg" href="${u}">${t.download}</a></div>`}result(out)}
else if(active==='img-resize'){const im=await loadImage(f);let w=+$('w').value,h=+$('h').value;if($('keep').checked){if(w&&!h)h=Math.round(im.naturalHeight*w/im.naturalWidth);else if(h&&!w)w=Math.round(im.naturalWidth*h/im.naturalHeight)}if(!w||!h)throw Error(t.invalid);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);const b=await blobCanvas(c,'image/png');const u=URL.createObjectURL(b);result(`<div class="item"><img class="thumb" src="${u}"><div class="info"><div class="name">${esc(f.name)}</div><div class="meta">${w}×${h}</div></div><a class="download" download="resized.png" href="${u}">${t.download}</a></div>`)}
else if(active==='img-convert'){const im=await loadImage(f),c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);const type=$('fmt').value,b=await blobCanvas(c,type,+$('cq').value/100),ext=type.split('/')[1]==='jpeg'?'jpg':type.split('/')[1],u=URL.createObjectURL(b);result(`<div class="item"><div class="info"><div class="name">${esc(f.name)}</div><div class="meta">${fmt(f.size)} → ${fmt(b.size)}</div></div><a class="download" download="converted.${ext}" href="${u}">${t.download}</a></div>`)}
else if(active==='img-crop'){const c=await imageCanvas(f,{crop:true,w:+$('cw').value,h:+$('ch').value}),b=await blobCanvas(c,'image/png'),u=URL.createObjectURL(b);result(`<img class="preview" src="${u}"><a class="download" download="cropped.png" href="${u}">${t.download}</a>`)}
else if(active==='img-edit'){const c=await imageCanvas(f,{rot:+$('rot').value,fh:$('fh').checked,fv:$('fv').checked}),b=await blobCanvas(c,'image/png'),u=URL.createObjectURL(b);result(`<img class="preview" src="${u}"><a class="download" download="edited.png" href="${u}">${t.download}</a>`)}
else if(active==='img-watermark'){const im=await loadImage(f),c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);x.font=`${+$('ws').value}px sans-serif`;x.fillStyle=$('wc').value;x.globalAlpha=.75;x.textAlign='right';x.fillText($('wm').value||'TonaTools',c.width-25,c.height-25);const b=await blobCanvas(c,'image/png'),u=URL.createObjectURL(b);result(`<img class="preview" src="${u}"><a class="download" download="watermarked.png" href="${u}">${t.download}</a>`)}
else if(active==='img-pdf'||active==='pdf-create'){await loadPDFLib();const pdf=await PDFLib.PDFDocument.create();for(const file of currentFiles){const im=await loadImage(file),c=document.createElement('canvas'),scale=Math.min(1,1200/im.naturalWidth);c.width=Math.round(im.naturalWidth*scale);c.height=Math.round(im.naturalHeight*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const jpg=await blobCanvas(c,'image/jpeg',.9),emb=await pdf.embedJpg(new Uint8Array(await jpg.arrayBuffer())),page=pdf.addPage([emb.width,emb.height]);page.drawImage(emb,{x:0,y:0,width:emb.width,height:emb.height})}const b=new Blob([await pdf.save()],{type:'application/pdf'}),u=URL.createObjectURL(b);result(`<div class="item"><div class="info"><div class="name">TonaTools.pdf</div><div class="meta">${fmt(b.size)} • ${currentFiles.length}</div></div><a class="download" download="TonaTools.pdf" href="${u}">${t.download}</a></div>`)}}catch(e){result(`<div class="status">${esc(e.message||t.invalid)}</div>`)}}
async function extractPDFText(file){const pdfjs=await loadPDFjs();const task=pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())});const pdf=await task.promise;let out=[];for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const c=await page.getTextContent();out.push(c.items.map(x=>x.str).join(' '))}return out.join('\n\n')}
async function translateText(text,src,target){if(!text.trim())throw Error(L().enterText);if(src===target)return text;
if('Translator' in self){try{const tr=await Translator.create({sourceLanguage:src,targetLanguage:target});return await tr.translate(text)}catch(e){}}
const chunks=[];let rest=text;while(rest.length){chunks.push(rest.slice(0,1400));rest=rest.slice(1400)}let out=[];for(const chunk of chunks){const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(chunk)+'&langpair='+encodeURIComponent(src+'|'+target);const r=await fetch(url);if(!r.ok)throw Error('Translation service unavailable.');const j=await r.json();const translated=j?.responseData?.translatedText;if(!translated)throw Error('Translation failed.');out.push(translated)}return out.join(' ')}
function localSummarize(text){const clean=text.replace(/\s+/g,' ').trim();const sentences=clean.match(/[^.!?。！？]+[.!?。！？]+|[^.!?。！？]+$/g)||[clean];if(sentences.length<=1){if(clean.length<120)return clean;return clean.slice(0,Math.max(80,Math.floor(clean.length*.55))).replace(/\s+\S*$/,'')+'…'}const words=(clean.toLowerCase().match(/[\p{L}\p{N}]{3,}/gu)||[]);const stop=new Set(['the','and','that','this','with','from','for','are','was','were','have','has','had','you','your','but','not','can','على','من','في','وهو','هذه','ذلك','التي','أن','مع','عن','كان','كانت','هذا']);const freq={};for(const w of words)if(!stop.has(w))freq[w]=(freq[w]||0)+1;const scored=sentences.map((s,i)=>{const ws=s.toLowerCase().match(/[\p{L}\p{N}]{3,}/gu)||[];const score=ws.reduce((a,w)=>a+(freq[w]||0),0)/(ws.length||1);return {s:s.trim(),i,score}});const take=Math.max(3,Math.min(8,Math.ceil(sentences.length*.25)));return scored.sort((a,b)=>b.score-a.score).slice(0,take).sort((a,b)=>a.i-b.i).map(x=>x.s).join(' ')}
async function summarizeText(text){if(!text.trim())throw Error(L().enterText);if('Summarizer' in self){try{const s=await Summarizer.create({type:'tl;dr',format:'plain-text',length:'short'});return await s.summarize(text)}catch(e){}}return localSummarize(text)}
async function runFrame(){if(!needFiles())return;const f=currentFiles[0],v=document.createElement('video');v.src=URL.createObjectURL(f);v.muted=true;v.preload='auto';v.onloadedmetadata=()=>{v.currentTime=Math.min(+$('vt').value||0,v.duration)};v.onseeked=()=>{const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{const u=URL.createObjectURL(b);result(`<img class="preview" src="${u}"><a class="download" download="frame.jpg" href="${u}">${L().download}</a>`);},'image/jpeg',.92)}}
async function runMute(){if(!needFiles())return;const f=currentFiles[0],v=document.createElement('video');v.src=URL.createObjectURL(f);v.muted=true;v.playsInline=true;await v.play().catch(()=>{});const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const stream=c.captureStream(30),rec=new MediaRecorder(stream,{mimeType:'video/webm'}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'}),u=URL.createObjectURL(b);result(`<div class="item"><div class="info"><div class="name">muted.webm</div><div class="meta">${fmt(b.size)}</div></div><a class="download" download="muted.webm" href="${u}">${L().download}</a></div>`);v.pause()};function draw(){if(v.ended){rec.stop();return}c.getContext('2d').drawImage(v,0,0,c.width,c.height);requestAnimationFrame(draw)}rec.start();draw()}
async function runZip(){if(!needFiles())return;await loadJSZip();const z=new JSZip();currentFiles.forEach(f=>z.file(f.name,f));const b=await z.generateAsync({type:'blob'}),u=URL.createObjectURL(b);result(`<div class="item"><div class="info"><div class="name">TonaTools.zip</div><div class="meta">${currentFiles.length} • ${fmt(b.size)}</div></div><a class="download" download="TonaTools.zip" href="${u}">${L().download}</a></div>`)}
async function runUnzip(){if(!needFiles())return;await loadJSZip();const z=await JSZip.loadAsync(currentFiles[0]);result(Object.keys(z.files).map(n=>`<div class="item"><div class="info"><div class="name">${esc(n)}</div></div><button data-name="${esc(n)}">${L().download}</button></div>`).join(''));document.querySelectorAll('#results button').forEach(b=>b.onclick=async()=>downloadBlob(await z.files[b.dataset.name].async('blob'),b.dataset.name))}
function downloadBlob(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function runJSON(){try{$('jt').value=JSON.stringify(JSON.parse($('jt').value),null,2);result('<div class="status ok">✓ Valid JSON</div>')}catch(e){result(`<div class="status">${esc(e.message)}</div>`)}}
async function runQR(){if(!$('qt').value.trim())return;await loadQR();$('results').innerHTML='';new QRCode($('results'),{text:$('qt').value,width:256,height:256,correctLevel:QRCode.CorrectLevel.M})}
function runSimpleText(){try{const text=$('tt').value;if(!text.trim())throw Error(L().enterText);let out='';if(active==='text-count'){const words=(text.match(/\S+/g)||[]).length,chars=text.length,charsNoSpaces=text.replace(/\s/g,'').length,lines=text.split(/\r?\n/).length;out=`${L().words}: ${words}\n${L().characters}: ${chars}\nCharacters (no spaces): ${charsNoSpaces}\n${L().lines}: ${lines}`}else if(active==='text-case'){const mode=$('caseMode').value;if(mode==='upper')out=text.toUpperCase();else if(mode==='lower')out=text.toLowerCase();else out=text.toLowerCase().replace(/(^|[.!?。！？]\s+)([\p{L}])/gu,(m,p,c)=>p+c.toUpperCase())}else{out=text.split(/\r?\n/).filter(x=>x.trim()).filter((x,i,a)=>a.findIndex(y=>y.trim()===x.trim())===i).join('\n')}result(`<textarea class="text-area">${esc(out)}</textarea>`)}catch(e){result(`<div class="status">${esc(e.message)}</div>`)}}
async function runTextAI(){try{const text=$('tt').value;if(!text.trim())throw Error(L().enterText);let out;if(active==='text-translate')out=await translateText(text,$('srcLang').value,$('tgtLang').value);else out=await summarizeText(text);result(`<textarea class="text-area">${esc(out)}</textarea>`)}catch(e){result(`<div class="status">${esc(e.message)}</div>`)}}
async function runPDF(){if(!needFiles())return;result(`<div class="status">${L().processing}</div>`);try{if(active==='pdf-merge'){await loadPDFLib();const out=await PDFLib.PDFDocument.create();for(const f of currentFiles){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}const b=new Blob([await out.save()],{type:'application/pdf'}),u=URL.createObjectURL(b);return result(`<a class="download" href="${u}" download="merged.pdf">${L().download}</a>`)}const text=await extractPDFText(currentFiles[0]);if(active==='pdf-text')return result(`<textarea class="text-area">${esc(text)}</textarea>`);if(active==='pdf-translate'){const out=await translateText(text,'en',$('tgtLang').value);return result(`<textarea class="text-area">${esc(out)}</textarea>`)}if(active==='pdf-summary'){const out=await summarizeText(text);return result(`<textarea class="text-area">${esc(out)}</textarea>`)} }catch(e){result(`<div class="status">${esc(e.message)}</div>`)}}
$('lang').onchange=e=>{lang=e.target.value;render()};
const oldRender=renderWorkspace;renderWorkspace=function(){oldRender();wireActive()};
render();
