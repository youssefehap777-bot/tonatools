<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TonaTools - Free online image compressor. Compress images directly in your browser.">
<title>TonaTools — Free Image Compressor</title>
<style>
:root{--bg:#0b1020;--card:#121a2d;--text:#f5f7ff;--muted:#aab4cc;--accent:#7c5cff;--accent2:#19c7a5;--border:#25304a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#202a55 0,transparent 35%),var(--bg);color:var(--text);min-height:100vh}
header{max-width:1050px;margin:auto;padding:22px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.brand span{color:var(--accent2)}
select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
main{max-width:900px;margin:45px auto;padding:20px}.hero{text-align:center}.hero h1{font-size:clamp(35px,7vw,62px);margin:0 0 14px}.hero p{color:var(--muted);font-size:18px;margin:0 auto 35px;max-width:650px}
.card{background:rgba(18,26,45,.88);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 20px 70px #0005}
.drop{border:2px dashed #425174;border-radius:18px;padding:55px 20px;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:var(--accent);background:#7c5cff0d}.drop strong{display:block;font-size:21px;margin-bottom:8px}.drop small{color:var(--muted)}
input[type=file]{display:none}.controls{display:flex;gap:15px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:20px}.range{display:flex;align-items:center;gap:10px;color:var(--muted)}input[type=range]{accent-color:var(--accent);width:180px}
button{border:0;border-radius:11px;padding:11px 17px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#25304a}button:disabled{opacity:.45;cursor:not-allowed}
#results{margin-top:25px}.item{display:flex;gap:15px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:14px;margin-top:10px}.thumb{width:58px;height:58px;object-fit:cover;border-radius:10px}.info{flex:1;min-width:0}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:13px;color:var(--muted);margin-top:4px}.item button{white-space:nowrap}
footer{text-align:center;color:var(--muted);padding:30px 20px;font-size:13px}
[dir=rtl] .hero,[dir=rtl] .card{text-align:right}[dir=rtl] .controls{flex-direction:row-reverse}
@media(max-width:600px){main{margin:20px auto}.card{padding:18px}.drop{padding:42px 15px}.item{align-items:flex-start}.item button{padding:9px 11px}}
</style>
</head>
<body>
<header><div class="brand">Tona<span>Tools</span></div><select id="lang" aria-label="Language"></select></header>
<main>
<section class="hero"><h1 id="title"></h1><p id="subtitle"></p></section>
<section class="card">
<label class="drop" id="drop" for="file">
<strong id="dropTitle"></strong><small id="dropHint"></small>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple>
</label>
<div class="controls">
<label class="range"><span id="qualityLabel"></span><input id="quality" type="range" min="20" max="95" value="75"><b id="qualityValue">75%</b></label>
<button id="compress" disabled></button>
<button class="secondary" id="clear" disabled></button>
</div>
<div id="results"></div>
</section>
</main>
<footer id="footer"></footer>
<script>
const T={
en:{name:"English",title:"Compress images. Keep it simple.",subtitle:"Reduce image file size directly in your browser. Your images are not uploaded to a server.",drop:"Choose images or drag them here",hint:"JPG, PNG or WebP • Multiple files supported",quality:"Quality",compress:"Compress images",clear:"Clear",download:"Download",footer:"Free to use • Processing happens on your device"},
ar:{name:"العربية",title:"اضغط الصور بسهولة.",subtitle:"قلّل حجم الصور مباشرةً من متصفحك. صورك لا يتم رفعها إلى خادم.",drop:"اختار الصور أو اسحبها هنا",hint:"JPG أو PNG أو WebP • تقدر تختار أكتر من صورة",quality:"الجودة",compress:"ضغط الصور",clear:"مسح",download:"تحميل",footer:"مجاني للاستخدام • معالجة الصور تتم على جهازك"},
es:{name:"Español",title:"Comprime imágenes fácilmente.",subtitle:"Reduce el tamaño directamente en tu navegador. Tus imágenes no se suben a un servidor.",drop:"Elige imágenes o arrástralas aquí",hint:"JPG, PNG o WebP • Varios archivos",quality:"Calidad",compress:"Comprimir imágenes",clear:"Borrar",download:"Descargar",footer:"Gratis • El procesamiento ocurre en tu dispositivo"},
fr:{name:"Français",title:"Compressez vos images simplement.",subtitle:"Réduisez leur taille directement dans votre navigateur. Vos images ne sont pas envoyées à un serveur.",drop:"Choisissez des images ou glissez-les ici",hint:"JPG, PNG ou WebP • Plusieurs fichiers",quality:"Qualité",compress:"Compresser",clear:"Effacer",download:"Télécharger",footer:"Gratuit • Traitement sur votre appareil"}
};
let lang="en",files=[];
const $=id=>document.getElementById(id);
function fmt(n){return n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(2)} MB`}
function renderLang(){const l=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("title").textContent=l.title;$("subtitle").textContent=l.subtitle;$("dropTitle").textContent=l.drop;$("dropHint").textContent=l.hint;$("qualityLabel").textContent=l.quality;$("compress").textContent=l.compress;$("clear").textContent=l.clear;$("footer").textContent=l.footer;$("lang").innerHTML=Object.entries(T).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join("");$("lang").value=lang}
function refresh(){ $("compress").disabled=!files.length;$("clear").disabled=!files.length;$("results").innerHTML=files.map((f,i)=>`<div class="item"><img class="thumb" src="${f.url}"><div class="info"><div class="name">${escapeHtml(f.file.name)}</div><div class="meta">${fmt(f.file.size)}</div></div></div>`).join("")}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
$("lang").onchange=e=>{lang=e.target.value;renderLang()}
$("quality").oninput=e=>$("qualityValue").textContent=e.target.value+"%"
$("file").onchange=e=>add(e.target.files)
function add(list){for(const file of list){if(file.type.startsWith("image/"))files.push({file,url:URL.createObjectURL(file)})}refresh()}
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")}
$("drop").ondragleave=()=>$("drop").classList.remove("drag")
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("drag");add(e.dataTransfer.files)}
$("clear").onclick=()=>{files.forEach(x=>URL.revokeObjectURL(x.url));files=[];refresh()}
$("compress").onclick=async()=>{
const q=Number($("quality").value)/100, box=$("results");box.innerHTML="";
for(const x of files){
 const img=new Image();img.src=x.url;await img.decode();
 const canvas=document.createElement("canvas");canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 canvas.getContext("2d").drawImage(img,0,0);
 const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",q));
 const outUrl=URL.createObjectURL(blob), savings=Math.max(0,Math.round((1-blob.size/x.file.size)*100));
 const div=document.createElement("div");div.className="item";
 div.innerHTML=`<img class="thumb" src="${outUrl}"><div class="info"><div class="name">${escapeHtml(x.file.name)}</div><div class="meta">${fmt(x.file.size)} → ${fmt(blob.size)} • ${savings}% smaller</div></div><a download="${escapeHtml(x.file.name.replace(/\.[^.]+$/,""))}-compressed.jpg" href="${outUrl}"><button>${T[lang].download}</button></a>`;
 box.appendChild(div);
}
};
renderLang();$("lang").value=lang;
</script>
</body>
</html>
